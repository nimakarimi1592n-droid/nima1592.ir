<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AUTO SELECT</title>

<script>

(function(){

const ua = navigator.userAgent;

let device = "";
let fw = 0;


/* تشخیص PS5 */
if(ua.match(/PlayStation 5/i)){
    device = "PS5";
}

/* تشخیص PS4 */
else if(ua.match(/PlayStation 4/i)){
    device = "PS4";
}


/* گرفتن فریمور */
let version = ua.match(/([0-9]+\.[0-9]+)/);

if(version){
    fw = parseFloat(version[1]);
}


/* ================= PS5 ================= */

if(device === "PS5"){

    // PS5 1.00 تا 5.50
    if(fw >= 1.00 && fw <= 5.50){
        location.replace("https://nima1592.ir/PS5/5.50");
    }

    // PS5 6.00 تا 12.00
    else if(fw >= 6.00 && fw <= 12.00){
        location.replace("https://nima1592.ir/PS5/12.00");
    }

    // PS5 ورژن ناشناخته
    else{
        location.replace("https://nima1592.ir/PS5/UNKNOWN");
    }

}


/* ================= PS4 ================= */

else if(device === "PS4"){

    // PS4 1.00 تا 9.00
    if(fw >= 1.00 && fw <= 9.00){
        location.replace("https://nima1592.ir/PS4/9.00/AUTOLOADER");
    }

    // PS4 9.03 تا 9.60
    else if(fw >= 9.03 && fw <= 9.60){
        location.replace("https://nima1592.ir/PS4/9.60/AUTOLOADER");
    }

    // PS4 ورژن ناشناخته
    else{
        location.replace("https://nima1592.ir/PS4/UNKNOWN");
    }

}


/* ================= سایر دستگاه ها ================= */

else{

    location.replace("https://nima1592.ir/NOT-SUPPORTED");

}


})();

</script>

</head>

<body>

</body>
</html>
