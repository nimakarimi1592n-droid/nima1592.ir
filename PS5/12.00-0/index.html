<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #1a1500 0, #0f0d00 44%, #090800 100%);
    color: #e8dfa0;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  #cat {
    box-sizing: border-box; width: 150px; height: 150px; object-fit: cover;
    max-width: 34vw; max-height: 34vw;
    border: 4px solid #5a4e00; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }

  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }
  .action {
    box-sizing: border-box; display: inline-block; min-width: 185px;
    padding: 17px 30px; border: 1px solid rgba(255,220,50,.35);
    border-radius: 15px; color: #1a1200;
    background: linear-gradient(135deg, #f5c842, #c88a00);
    box-shadow: 0 12px 30px rgba(200,140,0,.38), inset 0 1px rgba(255,255,200,.28);
    font: 700 20px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }

  .action:focus {
    outline: none; transform: translateY(-3px);
    border-color: #ffe066; box-shadow: 0 0 0 4px rgba(245,200,66,.35), 0 16px 36px rgba(200,140,0,.5);
  }
  .action:active { transform: translateY(1px); }
  .action.secondary {
    color: #e8dfa0; background: linear-gradient(135deg, #2a2200, #181200);
    box-shadow: 0 12px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,220,50,.12);
  }
  .action.secondary:focus { box-shadow: 0 0 0 4px rgba(245,200,66,.25), 0 16px 36px rgba(0,0,0,.38); }
  .action.done {
    color: #effff4; background: linear-gradient(135deg, #239d52, #126531);
    border-color: rgba(123,255,162,.55); box-shadow: 0 12px 30px rgba(24,142,67,.26);
    pointer-events: none;
  }
  #status { min-height: 1.5em; color: #b8a840; font-size: 18px; }
  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; }
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="cat" src="slopkit/cat.jpg" alt="">
  <div id="actions">
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17&amp;autolaunch=pldmgr_v0_6_0.elf"
       tabindex="0">RUN</a>
  </div>
  <div id="status"></div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
