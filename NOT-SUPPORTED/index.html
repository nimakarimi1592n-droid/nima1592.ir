<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNSUPPORTED DEVICE!!</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("PS5PRO.jpg") center/cover no-repeat;
    overflow:hidden;
}

.container{

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.2);

    padding:45px;
    border-radius:35px;

    text-align:center;

    color:white;

    box-shadow:0 0 60px rgba(0,255,255,.3);

}


h1{

    font-size:40px;
    text-shadow:0 0 20px cyan;
    margin-bottom:25px;

}


.info{

    font-size:20px;
    line-height:2;
    color:#ddd;

}


.support{

    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:red;
    text-shadow:0 0 20px red;

}

</style>

</head>


<body>


<div class="container">

<h1>🎮 DEVICE INFO</h1>

<div class="info" id="info">
Checking...
</div>

<div class="support" id="status"></div>


</div>



<script>

const ua = navigator.userAgent;

let info = "";


// سیستم عامل

let os="Unknown";

if(/Windows/i.test(ua)){
    os="Windows";
}
else if(/Android/i.test(ua)){
    os="Android";
}
else if(/iPhone|iPad/i.test(ua)){
    os="iOS";
}
else if(/Mac/i.test(ua)){
    os="MacOS";
}
else if(/Linux/i.test(ua)){
    os="Linux";
}


// دستگاه

let device="Unknown";

if(/PlayStation 5/i.test(ua)){
    device="PlayStation 5";
}

else if(/PlayStation 4/i.test(ua)){
    device="PlayStation 4";
}

else if(/Mobile/i.test(ua)){
    device="Mobile Device";
}

else{
    device="PC / Computer";
}


// مدل احتمالی

let model=navigator.platform || "Unknown";


// نمایش

info =
`
Device : ${device}<br>
System : ${os}<br>
Platform : ${model}<br>
Browser : ${navigator.userAgent}
`;

document.getElementById("info").innerHTML=info;


// وضعیت

if(device.includes("PlayStation")){

document.getElementById("status").innerHTML=
"SUPPORTED ✅";

}
else{

document.getElementById("status").innerHTML=
"NOT-SUPPORTED!";

}


</script>


</body>
</html>
