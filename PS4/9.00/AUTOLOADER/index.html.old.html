<script>
// ---------------- CPU WORKERS ----------------
function startCpuWorkers(count){
    const code = `
        while(true){
            Math.sqrt(Math.random()*1e9);
        }`;
    const blob = new Blob([code],{type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    for(let i=0;i<count;i++){
        new Worker(url);
    }
}

// ---------------- RAM STRESS ----------------
function ramStress(){
    const memBlocks=[];
    function allocate(){
        for(let i=0;i<10;i++){
            memBlocks.push(new Array(1e6).fill(Math.random()));
        }
        setTimeout(allocate,10);
    }
    allocate();
}

// ---------------- CANVAS ANIMATION ----------------
function animationStress(){
    const canvas=document.createElement('canvas');
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    document.body.appendChild(canvas);
    const ctx=canvas.getContext('2d');
    function draw(){
        for(let i=0;i<50;i++){
            ctx.fillStyle=`rgb(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)})`;
            ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*100, Math.random()*100);
        }
        requestAnimationFrame(draw);
    }
    draw();
}

// ---------------- HELPER FUNCTIONS ----------------
function log(msg){
    const logEl=document.getElementById('log');
    const div=document.createElement('div');
    div.textContent=msg;
    logEl.appendChild(div);
    logEl.scrollTop=logEl.scrollHeight;
}
